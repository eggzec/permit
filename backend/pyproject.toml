[project]
name = "permit"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "psycopg-pool>=3.3.0,<4.0.0",
    "pyjwt>=2.11.0,<3.0.0",
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "testcontainers[postgres]>=4.0.0",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
    "pytest-xdist>=3.5.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 80
indent-width = 4
preview = true

# Output serialization format for violations. The default serialization
# format is "full" [env: RUFF_OUTPUT_FORMAT=] [possible values:
# concise, full, json, json-lines, junit, grouped, github, gitlab,
# pylint, rdjson, azure, sarif]
output-format = "grouped"

[tool.ruff.lint]
isort.lines-after-imports = 2
isort.split-on-trailing-comma = false

select = [
    "ANN", # flake8-annotations (required strict type annotations for public functions)
    "S",   # flake8-bandit (checks basic security issues in code)
    "BLE", # flake8-blind-except (checks the except blocks that do not specify exception)
    "FBT", # flake8-boolean-trap (ensure that boolean args can be used with kw only)
    "E",   # pycodestyle errors (PEP 8 style guide violations)
    "W",   # pycodestyle warnings (e.g., extra spaces, indentation issues)
    "DOC", # pydoclint issues (e.g., extra or missing return, yield, warnings)
    "A",   # flake8-builtins (check variable and function names to not shadow builtins)
    "N",   # Naming convention checks (e.g., PEP 8 variable and function names)
    "F",   # Pyflakes errors (e.g., unused imports, undefined variables)
    "I",   # isort (Ensures imports are sorted properly)
    "B",   # flake8-bugbear (Detects likely bugs and bad practices)
    "TID", # flake8-tidy-imports (Checks for banned or misplaced imports)
    "UP",  # pyupgrade (Automatically updates old Python syntax)
    "YTT", # flake8-2020 (Detects outdated Python 2/3 compatibility issues)
    "FLY", # flynt (Converts old-style string formatting to f-strings)
    "PIE", # flake8-pie
    "PL",  # pylint
    "RUF", # Ruff-specific rules (Additional optimizations and best practices)
]

ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN001",    # [flake8-annotations](https://docs.astral.sh/ruff/rules/missing-type-function-argument/)
    "ANN002",    # [flake8-annotations](https://docs.astral.sh/ruff/rules/missing-type-args/)
    "ANN003",    # [flake8-annotations](https://docs.astral.sh/ruff/rules/missing-type-kwargs/)
    "ANN201",    # [flake8-annotations](https://docs.astral.sh/ruff/rules/missing-return-type-undocumented-public-function/)
    "ANN202",    # [flake8-annotations](https://docs.astral.sh/ruff/rules/missing-return-type-private-function/)
    "S101",      # [flake8-bandit](https://docs.astral.sh/ruff/rules/assert/)
    "S105",      # [flake8-bandit](https://docs.astral.sh/ruff/rules/hardcoded-password-string/)
    "S106",      # [flake8-bandit](https://docs.astral.sh/ruff/rules/hardcoded-password-func-arg/)
    "S107",      # [flake8-bandit](https://docs.astral.sh/ruff/rules/hardcoded-password-default/)
    "PLR2004",   # [pylint](https://docs.astral.sh/ruff/rules/magic-value-comparison/)
    "PLR6301",   # [pylint](https://docs.astral.sh/ruff/rules/no-self-use/)
    "DOC201",    # [pydoclint](https://docs.astral.sh/ruff/rules/docstring-missing-returns/)
    "DOC402",    # [pydoclint](https://docs.astral.sh/ruff/rules/docstring-missing-yields/)
    "DOC501",    # [pydoclint](https://docs.astral.sh/ruff/rules/docstring-missing-exception/)
]
"tests/__init__.py" = [
    "RUF067",    # [ruff](https://docs.astral.sh/ruff/rules/non-empty-init-module/)
]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Pure unit tests (no external dependencies)",
    "integration: Integration tests (require database / containers)",
    "api: Tests exercising the HTTP API layer",
]
